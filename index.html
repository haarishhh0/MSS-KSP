<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Responsive Butterfly Effect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #88CEFF;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #app { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #88CEFF; }
    #webgl-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; z-index: 1; cursor: grab; touch-action: none; }
    #webgl-canvas.dragging { cursor: grabbing; }

    #hero {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; pointer-events: none; color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 0 24px rgba(0,0,0,.35);
    }
    #hero .emoji {
      display: inline-block; font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1;
      animation: flap .8s infinite ease-in-out;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
    }
    h1 {
      font-size: clamp(2rem, 8.5vw, 5.2rem); white-space: nowrap;
      font-weight: 800; letter-spacing: 1px; line-height: 1.05; margin-top: 6px;
    }
    #hero p {
      margin-top: 14px; font-size: clamp(.8rem, 2.4vw, 1.35rem);
      font-weight: 700; letter-spacing: 1.5px;
    }
    @keyframes flap {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }

    #controls {
      position: fixed; z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex; gap: 8px;
    }
    .btn.off { opacity: .55; }
    .btn {
      border: 1px solid rgba(255,255,255,.55); background: rgba(0,0,0,.3);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; padding: 8px 14px; border-radius: 12px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform .2s, background .2s;
    }
    .btn:hover { background: rgba(0,0,0,.5); transform: scale(1.04); }
    .btn:active { transform: scale(.95); }
    @media (max-width: 600px) { .btn { padding: 7px 11px; font-size: 12px; } }
    @media (max-height: 480px) and (orientation: landscape) {
      #hero .emoji { font-size: 2.2rem; }
      h1 { font-size: clamp(1.6rem, 9vh, 2.6rem); }
      #hero p { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="webgl-canvas"></canvas>

    <div id="hero">
      <span class="emoji" id="hero-emoji">❤️</span>
      <h1 id="hero-title">Butterflies</h1>
      <p id="hero-sub">Drag • Zoom • Move</p>
    </div>

    <div id="controls">
      <button class="btn" id="btn-rotate" title="Auto rotate 360°">🔄 Rotate</button>
      <button class="btn off" id="btn-gyro" title="Look around by moving your phone">🧭 Gyro</button>
      <button class="btn" id="btn-count" title="Change number of butterflies">🦋 <span id="count-label"></span></button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>

  <script>
  (() => {
    /* ---------- Easy settings: change the text here ---------- */
    const TITLE = 'MSS LOVE KSP';
    const SUBTITLE = 'Drag • Zoom • Move';
    const SKY = 0x88CEFF;

    document.getElementById('hero-title').textContent = TITLE;
    document.getElementById('hero-sub').textContent = SUBTITLE;

    const canvas = document.getElementById('webgl-canvas');
    const countBtn = document.getElementById('btn-count');
    const countLabel = document.getElementById('count-label');

    const isMobile = matchMedia('(max-width: 700px)').matches || matchMedia('(pointer: coarse)').matches;
    const tiers = isMobile ? [150, 300, 500] : [300, 600, 1000];
    const MAX = 1000;
    let tierIdx = 1;
    let activeCount = tiers[tierIdx];

    /* ---------- Scene ---------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(SKY);
    scene.fog = new THREE.FogExp2(SKY, 0.0055);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 800);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    /* ---------- Soft clouds all around (gives a sense of 360°) ---------- */
    (function makeClouds() {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(128, 128, 10, 128, 128, 126);
      g.addColorStop(0, 'rgba(255,255,255,.9)');
      g.addColorStop(.5, 'rgba(255,255,255,.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: .28, depthWrite: false, fog: false });
      const n = isMobile ? 40 : 70;
      for (let i = 0; i < n; i++) {
        const s = new THREE.Sprite(mat);
        const a = Math.random() * Math.PI * 2;
        const el = (Math.random() - .35) * 1.2;
        const R = 320;
        s.position.set(Math.cos(a) * Math.cos(el) * R, Math.sin(el) * R, Math.sin(a) * Math.cos(el) * R);
        const sc = 90 + Math.random() * 140;
        s.scale.set(sc * 1.6, sc, 1);
        scene.add(s);
      }
    })();

    /* ---------- Procedural realistic wing textures ---------- */
    function wingPath(ctx) {
      ctx.beginPath();
      ctx.moveTo(8, 256);
      ctx.bezierCurveTo(40, 120, 200, 20, 470, 36);
      ctx.bezierCurveTo(505, 70, 500, 150, 410, 205);
      ctx.bezierCurveTo(370, 230, 340, 255, 360, 290);
      ctx.bezierCurveTo(410, 330, 450, 400, 400, 455);
      ctx.bezierCurveTo(360, 500, 230, 505, 150, 440);
      ctx.bezierCurveTo(60, 380, 8, 320, 8, 256);
      ctx.closePath();
    }
    function ell(ctx, x, y, rx, ry, rot, color) {
      ctx.fillStyle = color; ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
    }
    const foreDots = [[480,70],[493,110],[486,150],[455,185],[420,203],[455,60],[470,100]];
    const hindDots = [[425,410],[395,455],[350,480],[290,486],[220,475],[400,380],[330,470]];
    function dots(ctx, pts, color, r) {
      ctx.fillStyle = color;
      pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fill(); });
    }

    const species = [
      { // Teal / blue swallowtail
        edge: '#04141a', borderW: 40,
        paint(ctx) {
          const g = ctx.createLinearGradient(0, 256, 480, 256);
          g.addColorStop(0, '#06303a'); g.addColorStop(.35, '#19c2c4'); g.addColorStop(1, '#0a7c92');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
          ell(ctx, 260, 120, 120, 35, -.35, 'rgba(120,255,240,.35)');
          ell(ctx, 330, 360, 90, 50, .5, 'rgba(120,255,240,.28)');
          ell(ctx, 400, 95, 55, 26, -.5, 'rgba(0,0,0,.75)');
          ell(ctx, 330, 205, 40, 14, .2, 'rgba(0,0,0,.6)');
          dots(ctx, foreDots, '#bff7f0', 5); dots(ctx, hindDots, '#bff7f0', 5);
        }
      },
      { // Red admiral style (black + red)
        edge: '#120606', borderW: 34,
        paint(ctx) {
          ctx.fillStyle = '#2a0b0b'; ctx.fillRect(0, 0, 512, 512);
          ctx.fillStyle = '#d8232c';
          ctx.beginPath(); ctx.moveTo(130, 190); ctx.lineTo(330, 90); ctx.lineTo(400, 150); ctx.lineTo(180, 245); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#c91d26';
          ctx.beginPath(); ctx.ellipse(250, 430, 150, 40, .5, 0, 7); ctx.fill();
          ell(ctx, 200, 300, 70, 30, .3, 'rgba(180,30,30,.6)');
          dots(ctx, [[430,45],[450,70],[410,40],[470,95]], '#ffffff', 8);
          dots(ctx, hindDots, '#7fb5ff', 4);
        }
      },
      { // Cream / orange-tip
        edge: '#2a1e12', borderW: 18,
        paint(ctx) {
          const g = ctx.createLinearGradient(0, 256, 480, 256);
          g.addColorStop(0, '#d9c89a'); g.addColorStop(.5, '#f6ecd0'); g.addColorStop(1, '#fff8e6');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
          ell(ctx, 450, 70, 90, 70, -.6, '#1a140f');
          dots(ctx, [[440,50],[462,78],[420,70],[470,110]], '#ffffff', 7);
          ell(ctx, 385, 95, 50, 34, -.5, '#f08a1f');
          ell(ctx, 280, 380, 120, 70, .4, 'rgba(120,130,70,.28)');
          ell(ctx, 150, 330, 60, 40, .2, 'rgba(120,130,70,.22)');
        }
      },
      { // Monarch
        edge: '#0a0705', borderW: 34,
        paint(ctx) {
          const g = ctx.createRadialGradient(40, 256, 10, 250, 256, 380);
          g.addColorStop(0, '#ffb02e'); g.addColorStop(.6, '#f26b0a'); g.addColorStop(1, '#c84a00');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
          ctx.strokeStyle = '#0a0705'; ctx.lineWidth = 7; ctx.lineCap = 'round';
          [[40,250,200,150,440,60],[40,252,240,200,470,130],[40,256,260,250,430,200],
           [40,262,200,320,380,400],[40,262,150,380,300,470],[40,260,100,340,160,440]].forEach(v => {
            ctx.beginPath(); ctx.moveTo(v[0], v[1]); ctx.quadraticCurveTo(v[2], v[3], v[4], v[5]); ctx.stroke();
          });
          dots(ctx, foreDots, '#ffffff', 6); dots(ctx, hindDots, '#ffffff', 6);
          dots(ctx, [[400,90],[420,120],[380,70]], '#ffe0a8', 9);
        }
      },
      { // Red mottled (like the dark red ones in the reference)
        edge: '#1a0705', borderW: 30,
        paint(ctx) {
          const g = ctx.createLinearGradient(0, 256, 480, 256);
          g.addColorStop(0, '#3b0d09'); g.addColorStop(.5, '#a3231a'); g.addColorStop(1, '#5a140e');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
          for (let i = 0; i < 90; i++) {
            const x = 40 + Math.random() * 440, y = 40 + Math.random() * 440;
            ell(ctx, x, y, 4 + Math.random() * 14, 3 + Math.random() * 9, Math.random() * 3,
              Math.random() < .5 ? 'rgba(15,5,5,.65)' : 'rgba(210,60,40,.45)');
          }
          dots(ctx, foreDots, '#f3d9b8', 4);
        }
      }
    ];

    function makeWingTexture(sp) {
      const c = document.createElement('canvas'); c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.save();
      wingPath(ctx); ctx.clip();
      sp.paint(ctx);
      // veins
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2.2;
      for (let i = 0; i < 14; i++) {
        const a = -1.15 + i * 0.17;
        ctx.beginPath(); ctx.moveTo(14, 256);
        ctx.quadraticCurveTo(160, 256 + Math.sin(a) * 90, 14 + Math.cos(a) * 470, 256 + Math.sin(a) * 300);
        ctx.stroke();
      }
      // scale grain
      for (let i = 0; i < 2200; i++) {
        ctx.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.06)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2 + Math.random() * 3, 2 + Math.random() * 3);
      }
      // dark body-side shading
      const sh = ctx.createLinearGradient(0, 0, 90, 0);
      sh.addColorStop(0, 'rgba(0,0,0,.55)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh; ctx.fillRect(0, 0, 90, 512);
      // dark wing border
      wingPath(ctx);
      ctx.strokeStyle = sp.edge; ctx.lineWidth = sp.borderW; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.restore();
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }

    /* ---------- Instanced butterflies ---------- */
    const W = 4;
    const rightGeo = new THREE.PlaneGeometry(W, W);
    rightGeo.rotateX(Math.PI / 2);     // lay flat, top of texture = forward (+Z)
    rightGeo.translate(W / 2, 0, 0);   // hinge at body
    const leftGeo = rightGeo.clone();
    leftGeo.scale(-1, 1, 1);
    const bodyGeo = new THREE.CylinderGeometry(.16, .07, 2.8, 6);
    bodyGeo.rotateX(Math.PI / 2);
    const bodyMat = new THREE.MeshBasicMaterial({ color: 0x1a1210 });

    const NS = species.length;
    const per = Math.ceil(MAX / NS);
    const sets = species.map(sp => {
      const wm = new THREE.MeshBasicMaterial({
        map: makeWingTexture(sp), transparent: true, alphaTest: .35, side: THREE.DoubleSide
      });
      const s = {
        body: new THREE.InstancedMesh(bodyGeo, bodyMat, per),
        left: new THREE.InstancedMesh(leftGeo, wm, per),
        right: new THREE.InstancedMesh(rightGeo, wm, per),
        count: 0
      };
      [s.body, s.left, s.right].forEach(m => {
        m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        m.frustumCulled = false;
        scene.add(m);
      });
      return s;
    });

    /* Swarm centres: butterflies clump and drift around the whole sphere, like the reference */
    const swarms = [];
    for (let i = 0; i < 8; i++) {
      swarms.push({
        pos: new THREE.Vector3(),
        a: Math.random() * 6.28, sa: (Math.random() - .5) * .18,
        b0: (Math.random() - .5) * 1.0, sb: .1 + Math.random() * .2, bp: Math.random() * 6.28,
        r: 22 + Math.random() * 40
      });
    }

    const B = [];
    for (let i = 0; i < MAX; i++) {
      const dir = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() :
        new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      const r = 10 + Math.pow(Math.random(), 1.4) * 65;
      B.push({
        sp: i % NS, idx: 0,
        pos: dir.multiplyScalar(r),
        vel: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).setLength(3),
        target: new THREE.Vector3(),
        swarm: Math.random() < .6 ? Math.floor(Math.random() * swarms.length) : -1,
        scale: .5 + Math.random() * .65,
        speed: 3 + Math.random() * 5,
        flap: 9 + Math.random() * 6,
        phase: Math.random() * 6.28,
        timer: Math.random() * 4,
        glide: Math.random() * 2, gliding: false
      });
    }

    function setCount(n) {
      activeCount = n;
      sets.forEach(s => s.count = 0);
      for (let i = 0; i < n; i++) { const b = B[i]; b.idx = sets[b.sp].count++; }
      sets.forEach(s => { s.body.count = s.left.count = s.right.count = s.count; });
      countLabel.textContent = n + ' Butterflies';
    }
    setCount(activeCount);
    countBtn.addEventListener('click', e => {
      e.stopPropagation();
      tierIdx = (tierIdx + 1) % tiers.length; setCount(tiers[tierIdx]);
    });
    countBtn.addEventListener('pointerdown', e => e.stopPropagation());

    /* ---------- Auto-rotate + gyroscope (phone 360°) ---------- */
    let autoRotate = true;
    const rotBtn = document.getElementById('btn-rotate');
    rotBtn.addEventListener('click', () => { autoRotate = !autoRotate; rotBtn.classList.toggle('off', !autoRotate); });

    const gyroBtn = document.getElementById('btn-gyro');
    let gyroOn = false, gotDev = false;
    const dev = { a: 0, b: 0, g: 0 };
    const D2R = Math.PI / 180;
    if (!(isMobile && 'DeviceOrientationEvent' in window)) gyroBtn.style.display = 'none';
    function onDev(e) {
      if (e.alpha == null) return;
      dev.a = e.alpha * D2R; dev.b = e.beta * D2R; dev.g = e.gamma * D2R; gotDev = true;
    }
    gyroBtn.addEventListener('click', async () => {
      if (!gyroOn) {
        try {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const r = await DeviceOrientationEvent.requestPermission();
            if (r !== 'granted') return;
          }
        } catch (_) { return; }
        addEventListener('deviceorientation', onDev);
        gyroOn = true;
      } else {
        removeEventListener('deviceorientation', onDev);
        gyroOn = false;
      }
      gyroBtn.classList.toggle('off', !gyroOn);
    });
    const zee = new THREE.Vector3(0, 0, 1), eul = new THREE.Euler(), q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
    function setGyroQuat(q) {
      const orient = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * D2R;
      eul.set(dev.b, dev.a, -dev.g, 'YXZ');
      q.setFromEuler(eul);
      q.multiply(q1);
      q.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function pickTarget(b) {
      if (b.swarm >= 0) {
        const s = swarms[b.swarm].pos;
        b.target.set(s.x + (Math.random() - .5) * 26, s.y + (Math.random() - .5) * 26, s.z + (Math.random() - .5) * 26);
      } else {
        b.target.randomDirection ? b.target.randomDirection() :
          b.target.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
        b.target.multiplyScalar(14 + Math.random() * 62);
      }
    }
    B.forEach(pickTarget);

    /* ---------- 360° look-around controls ---------- */
    let yaw = 0, pitch = 0, vYaw = 0, vPitch = 0;
    let fov = 70, targetFov = 70;
    const FOV_MIN = 25, FOV_MAX = 100;
    let lastInput = 0;
    const pointers = new Map();
    let pinchDist = 0;

    function pxToRad() { return (camera.fov * Math.PI / 180) / innerHeight; }

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      canvas.classList.add('dragging');
      vYaw = vPitch = 0;
      if (pointers.size === 2) {
        const [p, q] = [...pointers.values()];
        pinchDist = Math.hypot(p.x - q.x, p.y - q.y);
      }
    });
    canvas.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      lastInput = performance.now();
      if (pointers.size === 1) {
        const k = pxToRad();
        yaw += dx * k; pitch += dy * k;
        vYaw = dx * k; vPitch = dy * k;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDist) targetFov = Math.max(FOV_MIN, Math.min(FOV_MAX, targetFov * pinchDist / d));
        pinchDist = d;
      }
    });
    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchDist = 0;
      if (!pointers.size) canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      targetFov = Math.max(FOV_MIN, Math.min(FOV_MAX, targetFov * (1 + e.deltaY * 0.001)));
      lastInput = performance.now();
    }, { passive: false });

    addEventListener('keydown', e => {
      const k = .08;
      if (e.key === 'ArrowLeft') yaw += k;
      if (e.key === 'ArrowRight') yaw -= k;
      if (e.key === 'ArrowUp') pitch = Math.min(1.45, pitch + k);
      if (e.key === 'ArrowDown') pitch = Math.max(-1.45, pitch - k);
      if (e.key === '+' || e.key === '=') targetFov = Math.max(FOV_MIN, targetFov * .92);
      if (e.key === '-') targetFov = Math.min(FOV_MAX, targetFov * 1.08);
      lastInput = performance.now();
    });

    /* ---------- Resize / responsive ---------- */
    function applyFov() {
      const aspect = innerWidth / innerHeight;
      // keep horizontal view comfortable on portrait phones
      camera.fov = aspect < 1 ? Math.min(120, fov / Math.pow(aspect, .8)) : fov;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
    }
    function onResize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      applyFov();
    }
    addEventListener('resize', onResize);
    addEventListener('orientationchange', () => setTimeout(onResize, 250));

    /* ---------- Animation ---------- */
    const clock = new THREE.Clock();
    const des = new THREE.Vector3(), look = new THREE.Vector3();
    const obj = new THREE.Object3D();
    const m = new THREE.Matrix4(), rot = new THREE.Matrix4();
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      t += dt;

      // camera: inertia + gentle auto-spin when idle
      const idle = performance.now() - lastInput > 1200 && pointers.size === 0;
      if (pointers.size === 0) {
        yaw += vYaw; pitch += vPitch;
        vYaw *= .93; vPitch *= .93;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
      }
      if (autoRotate && idle && !gyroOn) yaw -= dt * .25;
      fov += (targetFov - fov) * .12;
      applyFov();
      if (gyroOn && gotDev) setGyroQuat(camera.quaternion);
      else camera.rotation.set(pitch, yaw, 0);

      // swarm centres
      for (const s of swarms) {
        s.a += s.sa * dt;
        const bb = s.b0 + Math.sin(t * s.sb + s.bp) * .5;
        s.pos.set(Math.cos(s.a) * Math.cos(bb), Math.sin(bb), Math.sin(s.a) * Math.cos(bb)).multiplyScalar(s.r);
      }

      for (let i = 0; i < activeCount; i++) {
        const b = B[i];
        b.timer -= dt;
        if (b.timer <= 0) { b.timer = 3 + Math.random() * 5; pickTarget(b); }

        des.copy(b.target).sub(b.pos);
        const d = des.length() || 1;
        des.multiplyScalar(b.speed / d);
        b.vel.lerp(des, 1 - Math.exp(-dt * 1.2));
        b.vel.x += (Math.random() - .5) * dt * 7;
        b.vel.y += (Math.random() - .5) * dt * 7;
        b.vel.z += (Math.random() - .5) * dt * 7;

        const r = b.pos.length();
        if (r < 9) b.vel.addScaledVector(b.pos, dt * 4);
        else if (r > 88) b.vel.addScaledVector(b.pos, -dt * 1.5);
        b.pos.addScaledVector(b.vel, dt);

        b.glide -= dt;
        if (b.glide <= 0) {
          b.gliding = !b.gliding;
          b.glide = b.gliding ? .6 + Math.random() * 1.2 : 1.5 + Math.random() * 2.5;
        }
        let wa;
        if (b.gliding) wa = .55 + Math.sin(t * 2 + b.phase) * .08;
        else {
          wa = Math.sin(t * b.flap + b.phase) * .9 + .35;
          b.pos.y += Math.cos(t * b.flap + b.phase) * .03;
        }

        obj.position.copy(b.pos);
        obj.scale.setScalar(b.scale);
        look.copy(b.pos).add(b.vel);
        obj.lookAt(look);
        obj.rotateZ(Math.sin(t * .8 + b.phase) * .3);
        obj.updateMatrix();

        const s = sets[b.sp];
        s.body.setMatrixAt(b.idx, obj.matrix);
        rot.makeRotationZ(wa);
        m.multiplyMatrices(obj.matrix, rot);
        s.right.setMatrixAt(b.idx, m);
        rot.makeRotationZ(-wa);
        m.multiplyMatrices(obj.matrix, rot);
        s.left.setMatrixAt(b.idx, m);
      }
      for (const s of sets) {
        s.body.instanceMatrix.needsUpdate = true;
        s.left.instanceMatrix.needsUpdate = true;
        s.right.instanceMatrix.needsUpdate = true;
      }
      renderer.render(scene, camera);
    }
    onResize();
    animate();
  })();
  </script>
